
workflows:
  ios-workflow:
    name: Webhook Alerts - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: tech.infinityware.webhookalerts
        XCODE_PROJECT: "ios/WebhookAlerts.xcodeproj"
      xcode: latest
    scripts:
      - name: Check Xcode project
        script: |
          if [ ! -d "$XCODE_PROJECT" ]; then
            echo "Projeto Xcode nao encontrado: $XCODE_PROJECT"
            exit 1
          fi
      - name: Build iOS
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme WebhookAlerts \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
