workflows:
  ios-workflow:
    name: Webhook Alerts - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build iOS
        script: |
          xcodebuild \
            -project ios/WebhookAlerts.xcodeproj \
            -scheme WebhookAlerts \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/Build/Products/Release-iphoneos/WebhookAlerts.app
      - /tmp/xcodebuild_logs/*.log
